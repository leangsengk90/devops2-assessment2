name: Rebuild prod

# Push a change to rebuild.sh  -> full rebuild: destroy and recreate remote-state, infrastructures
#                                 and deployments (ECR repositories and images are kept).
# Push a change to redeploy.sh -> redeploy the microservices only.
# Push a change to destroy.sh  -> destroy everything, including the ECR repositories and images.
# If several change in one push: destroy wins over rebuild, rebuild wins over redeploy.
# After each run the timeline report is printed to the log and committed to reports/github-actions/.
# Run workflow with repeat N > 1 -> runs the chosen mode N times back to back (not for destroy).
on:
  push:
    branches: [main]
    paths:
      - rebuild.sh
      - redeploy.sh
      - destroy.sh
  workflow_dispatch:
    inputs:
      mode:
        description: What to run
        type: choice
        options: [redeploy, rebuild, destroy]
        default: redeploy
      repeat:
        description: How many runs in a row (each run starts the next; the chain stops at the first failure or cancel)
        type: number
        default: 1

concurrency:
  group: rebuild-prod
  cancel-in-progress: false

permissions:
  contents: write # commit the timeline report back to the repo
  actions: write  # start the next run when repeat > 1

env:
  AWS_REGION: ap-southeast-2
  TZ: Asia/Phnom_Penh
  TF_IN_AUTOMATION: "true"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Choose mode
        env:
          INPUT_MODE: ${{ inputs.mode }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            mode=$INPUT_MODE
          else
            if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then BEFORE=HEAD~1; fi
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            echo "Changed files:"; echo "$changed"
            if grep -qx 'destroy.sh' <<<"$changed"; then mode=destroy
            elif grep -qx 'rebuild.sh' <<<"$changed"; then mode=rebuild
            else mode=redeploy; fi
          fi
          echo "RUN_MODE=$mode" >> "$GITHUB_ENV"
          echo "Mode: $mode"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run ${{ env.RUN_MODE }}.sh
        run: ./"$RUN_MODE".sh

      # ---------------- report ----------------
      - name: Collect service health
        if: always() && env.API_ENDPOINT != ''
        run: |
          for s in auth messenger profile finance share; do
            read -r created steady < <(aws ecs describe-services \
              --cluster "devops2-g4-$s-cluster-prod" --services "devops2-g4-$s-service-prod" \
              --query 'services[0].[createdAt, events[?contains(message, `steady state`)]|[-1].createdAt]' \
              --output text || echo "None None")
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$API_ENDPOINT/$s" || true)
            echo "$s,$created,$steady,$code" >> "$RUNNER_TEMP/services.csv"
          done

      - name: Timeline report
        if: always() && env.RUN_MODE != ''
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 .github/scripts/report.py

      - name: Commit report to repo
        if: always() && env.RUN_MODE != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A rebuild recreates the remote-state stack, whose state is a tracked local file: commit it too
          # so the repo matches the real bucket. Anything else left over is stashed during the pull.
          git add reports/github-actions main/remote-state/terraform.tfstate.d
          git commit -m "Prod $RUN_MODE report: run #$GITHUB_RUN_NUMBER (${{ job.status }}) [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "Push failed (attempt $attempt), retrying"; sleep 5
          done
          exit 1

      - name: Start next run (repeat ${{ inputs.repeat }})
        if: success() && github.event_name == 'workflow_dispatch' && inputs.repeat > 1 && env.RUN_MODE != 'destroy'
        env:
          GH_TOKEN: ${{ github.token }}
          LEFT: ${{ inputs.repeat }}
        run: |
          gh workflow run rebuild-prod.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f mode="$RUN_MODE" -f repeat=$((LEFT - 1))
          echo "Started the next $RUN_MODE run; $((LEFT - 1)) to go including it"
